openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: shop
    description: Electronics catalog and shopping assistant
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /shop/products:
    get:
      operationId: listProducts
      tags: [shop]
      summary: List the available electronics
      responses:
        "200":
          description: Product catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /shop/assistant/reply:
    post:
      operationId: getShoppingAssistantReply
      tags: [shop]
      summary: Find electronics matching the shopper's needs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShoppingAssistantInput"
      responses:
        "200":
          description: A catalog-grounded reply with matching products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingAssistantReply"
        "502":
          description: The conversational recommendation service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingAssistantError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        price:
          type: number
        description:
          type: string
        image:
          type: string
        rating:
          type: number
        reviewCount:
          type: integer
        tags:
          type: array
          items:
            type: string
        badge:
          type: ["string", "null"]
      required: [id, name, category, price, description, image, rating, reviewCount, tags, badge]
    ShoppingAssistantTurn:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required: [role, content]
    ShoppingAssistantInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1000
        history:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/ShoppingAssistantTurn"
      required: [message, history]
    ShoppingAssistantReply:
      type: object
      properties:
        reply:
          type: string
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
      required: [reply, products]
    ShoppingAssistantError:
      type: object
      properties:
        error:
          type: string
      required: [error]

