openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: shop
    description: Electronics catalog and shopping assistant
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /shop/products:
    get:
      operationId: listProducts
      tags: [shop]
      summary: List the available electronics
      responses:
        "200":
          description: Product catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /shop/assistant/reply:
    post:
      operationId: getShoppingAssistantReply
      tags: [shop]
      summary: Find electronics matching the shopper's needs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShoppingAssistantInput"
      responses:
        "200":
          description: A catalog-grounded reply with matching products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingAssistantReply"
        "502":
          description: The conversational recommendation service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingAssistantError"
  /shop/assistant/settings:
    get:
      operationId: getAssistantBehaviorSettings
      tags: [shop]
      summary: Get the saved shopping assistant behavior settings
      responses:
        "200":
          description: Current assistant behavior settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantBehaviorSettings"
        "500":
          description: Assistant settings could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingAssistantError"
    put:
      operationId: updateAssistantBehaviorSettings
      tags: [shop]
      summary: Save the shopping assistant behavior settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantBehaviorSettingsUpdate"
      responses:
        "200":
          description: Saved assistant behavior settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantBehaviorSettings"
        "400":
          description: Invalid assistant settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingAssistantError"
        "500":
          description: Assistant settings could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingAssistantError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        brand:
          type: string
        category:
          type: string
        price:
          type: number
          description: Price in Indian rupees (INR).
        description:
          type: string
        specs:
          type: array
          description: Key specifications in plain words, most important first.
          items:
            type: string
        image:
          type: ["string", "null"]
          description: Optional photo URL. When null, the storefront shows a brand tile.
        tags:
          type: array
          items:
            type: string
        badge:
          type: ["string", "null"]
        priceSource:
          $ref: "#/components/schemas/PriceSource"
        origin:
          type: string
          enum: [catalog, market]
          description: Market items were found on the web; the store shows them like any other product.
        model:
          type: string
          description: Model name without the brand.
        colours:
          type: array
          items:
            $ref: "#/components/schemas/ProductColour"
        rating:
          type: ["number", "null"]
          description: Average star rating out of 5 from a real web listing, or null when none was found.
        reviewCount:
          type: ["integer", "null"]
        mrp:
          type: ["number", "null"]
          description: List price before discount (INR), shown struck through when higher than price.
        stock:
          $ref: "#/components/schemas/StockStatus"
        pickup:
          $ref: "#/components/schemas/PickupStatus"
        delivery:
          type: object
          properties:
            label:
              type: string
          required: [label]
        offers:
          type: array
          items:
            type: string
        images:
          type: array
          description: At least two images when a photo exists (the second may repeat the first).
          items:
            type: string
        overBudgetBy:
          type: ["number", "null"]
          description: Amount above the shopper's budget, for "+₹X over budget" labels in chat.
        why:
          type: ["string", "null"]
          description: Chat cards only. One sentence linking the product to the shopper's use and budget.
        headsUp:
          type: ["string", "null"]
          description: Chat cards only. Which of the shopper's requirements this product misses.
        bestFit:
          type: boolean
          description: Chat cards only. The best fit of the picks (shown with a star).
      required: [id, name, brand, category, price, description, specs, image, tags, badge, priceSource]
    ProductColour:
      type: object
      properties:
        name:
          type: string
        hex:
          type: string
      required: [name, hex]
    StockStatus:
      type: object
      properties:
        status:
          type: string
          enum: [in_stock, low_stock]
        label:
          type: string
        count:
          type: ["integer", "null"]
      required: [status, label, count]
    PickupStatus:
      type: object
      properties:
        store:
          type: string
        label:
          type: string
      required: [store, label]
    PriceSource:
      type: object
      description: Where the listed price came from, so shoppers can check it.
      properties:
        label:
          type: string
        url:
          type: string
        asOf:
          type: string
          description: Date the price was checked, e.g. "12 Oct 2026".
      required: [label, url, asOf]
    ShoppingAssistantTurn:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required: [role, content]
    ShoppingAssistantInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1000
        history:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/ShoppingAssistantTurn"
        quote:
          type: string
          maxLength: 2000
          description: An earlier assistant message the shopper is replying to, sent as context.
        deferred:
          type: boolean
          description: The message was already saved during the name step (a request sent before the name); answer it without saving it again.
        bag:
          type: array
          maxItems: 30
          description: What is in the shopper's bag right now.
          items:
            $ref: "#/components/schemas/BagLine"
        preferences:
          $ref: "#/components/schemas/ChatPreferences"
        requestHuman:
          type: boolean
          description: The shopper tapped "Talk to store expert".
        compareIds:
          type: array
          maxItems: 3
          description: The shopper tapped "Compare all" under a reply with three products; these are their IDs.
          items:
            type: string
      required: [message, history]
    Comparison:
      type: object
      properties:
        products:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              price:
                type: number
            required: [id, name, price]
        rows:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              values:
                type: array
                items:
                  type: object
                  properties:
                    text:
                      type: string
                    meetsRequirement:
                      type: boolean
                  required: [text, meetsRequirement]
            required: [label, values]
      required: [products, rows]
    BagLine:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        quantity:
          type: integer
        price:
          type: number
      required: [id, name, quantity, price]
    ChatPreferences:
      type: object
      description: Shopper-chosen chat settings, saved in the conversation state and passed to the model.
      properties:
        verbosity:
          type: string
          enum: [short, normal, detailed]
        mode:
          type: ["string", "null"]
          enum: [help-me-choose, know-what-i-want, null]
    ShoppingAssistantReply:
      type: object
      properties:
        reply:
          type: string
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        market:
          type: object
          properties:
            status:
              type: string
              enum: [used, not-needed, unavailable, disabled]
            checkedAt:
              type: ["string", "null"]
            sources:
              type: array
              items:
                type: object
                properties:
                  title:
                    type: string
                  url:
                    type: string
                required: [title, url]
          required: [status, checkedAt, sources]
        messageId:
          type: ["integer", "null"]
          description: Saved message ID, used for feedback on this reply.
        kind:
          type: string
          enum: [reply, human, off-topic]
          description: human = the shopper asked for a person; shown as a call-back card.
        suggestions:
          type: array
          maxItems: 6
          description: Tappable options shown under the reply (answers to its question, action buttons or follow-ups).
          items:
            type: string
        comparison:
          oneOf:
            - $ref: "#/components/schemas/Comparison"
            - type: "null"
        cartAdd:
          description: A product the assistant added to the cart after the shopper asked.
          oneOf:
            - $ref: "#/components/schemas/Product"
            - type: "null"
      required: [reply, products]
    AssistantBehaviorSettings:
      type: object
      properties:
        persona:
          type: string
          maxLength: 1200
        tone:
          type: string
          maxLength: 800
        initiativeGoal:
          type: string
          maxLength: 1200
        empathyExamples:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: string
            maxLength: 500
        teamPrompt:
          type: string
          maxLength: 40000
          description: The live team prompt (the default when nothing has been pasted).
        teamPromptDefault:
          type: string
          description: The built-in team prompt, for "Reset to default".
        empathyScale:
          type: integer
          minimum: 0
          maximum: 10
        goalOrientationScale:
          type: integer
          minimum: 0
          maximum: 10
        updatedAt:
          type: string
          format: date-time
      required: [persona, tone, initiativeGoal, empathyExamples, teamPrompt, teamPromptDefault, empathyScale, goalOrientationScale, updatedAt]
    AssistantBehaviorSettingsUpdate:
      type: object
      properties:
        persona:
          type: string
          minLength: 1
          maxLength: 1200
        tone:
          type: string
          minLength: 1
          maxLength: 800
        initiativeGoal:
          type: string
          minLength: 1
          maxLength: 1200
        empathyExamples:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 500
        teamPrompt:
          type: string
          minLength: 1
          maxLength: 40000
        empathyScale:
          type: integer
          minimum: 0
          maximum: 10
        goalOrientationScale:
          type: integer
          minimum: 0
          maximum: 10
      required: [persona, tone, initiativeGoal, empathyExamples, teamPrompt, empathyScale, goalOrientationScale]
    ShoppingAssistantError:
      type: object
      properties:
        error:
          type: string
      required: [error]

